<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguridad Vial, Consistencia Geométrica y Movilidad - Bibliografía</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent-base: #27728F; 
            --accent-bright: #5cd3ff; 
            --glass-bg: rgba(255, 255, 255, 0.02);
            --glass-border: rgba(39, 114, 143, 0.4);
            --text-main: #ffffff;
            --text-dim: #d4f2ff;
        }

        body {
            margin: 0; padding: 0; min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background-color: #031017;
            color: var(--text-main);
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden; cursor: default;
        }

        .fluid-background {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; overflow: hidden; background: #020a0e; filter: blur(80px);
        }
        .fluid-layer { position: absolute; border-radius: 50%; opacity: 0.35; animation: fluidMove infinite alternate ease-in-out; }
        .layer-1 { background: radial-gradient(circle, var(--accent-base) 0%, transparent 70%); width: 100vw; height: 100vw; top: -30%; left: -10%; animation-duration: 20s; }
        .layer-2 { background: radial-gradient(circle, #0d3849 0%, transparent 70%); width: 80vw; height: 80vw; bottom: -20%; right: -10%; animation-duration: 25s; }
        @keyframes fluidMove { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(10%, 5%) scale(1.1); } }

        /* Animaciones de entrada de impacto */
        @keyframes impactEntry {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
                filter: blur(4px);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }

        @keyframes headerEntry {
            0% {
                opacity: 0;
                transform: translateY(-20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .nav-instruction, .main-header {
            animation: headerEntry 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .nav-instruction {
            width: 90vw; max-width: 1400px;
            background: rgba(39, 114, 143, 0.15);
            border: 1px dashed var(--accent-bright);
            padding: 15px; border-radius: 12px;
            margin-top: 30px;
            text-align: center;
            font-size: 0.9rem; color: var(--accent-bright);
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .main-header { text-align: center; padding: 30px 20px; z-index: 1; animation-delay: 0.15s; }
        .main-header h1 { font-weight: 300; font-size: 2rem; letter-spacing: 4px; text-transform: uppercase; margin: 0; background: linear-gradient(to right, #fff, var(--text-dim)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .main-header .line { width: 60px; height: 3px; background: var(--accent-bright); margin: 15px auto; }

        .reference-grid {
            display: grid; width: 90vw; max-width: 1400px;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px; padding-bottom: 80px; z-index: 1;
        }

        .card {
            font-family: 'Poppins', sans-serif;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 25px;
            display: flex; flex-direction: column;
            transition: all 0.3s ease;
            min-height: 160px;
            opacity: 0;
            animation: impactEntry 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        .card:hover { 
            border-color: var(--accent-bright); 
            transform: translateY(-5px); 
            background: rgba(39, 114, 143, 0.12); 
            box-shadow: 0 10px 20px rgba(39, 114, 143, 0.25); 
        }

        .author-tag { font-size: 0.75rem; font-weight: 600; color: var(--accent-bright); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 12px; }
        .title { font-size: 0.9rem; font-weight: 400; line-height: 1.6; color: var(--text-main); margin-bottom: 15px; }

        .footer-info {
            font-size: 0.75rem; font-weight: 300; color: var(--text-dim);
            border-top: 1px solid rgba(39, 114, 143, 0.3);
            padding-top: 15px; margin-top: auto; word-break: break-all;
        }

        .link-text {
            color: var(--accent-bright);
            text-decoration: underline;
            transition: color 0.2s;
        }
        .link-text:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="fluid-background">
        <div class="fluid-layer layer-1"></div>
        <div class="fluid-layer layer-2"></div>
    </div>

    <div class="nav-instruction">
        🚦 <b>Instrucción de Navegación:</b> Consulta las referencias clave sobre seguridad vial, enfoque de sistema seguro, consistencia geométrica, velocidades de operación y diseño urbano.
    </div>

    <header class="main-header">
        <h1>Bibliografía</h1>
        <div class="line"></div>
    </header>

    <main class="reference-grid" id="grid"></main>

    <script>
        const sources = [
            { a: "AASHTO (2010)", t: "Highway Safety Manual (HSM)", f: "American Association of State Highway and Transportation Officials" },
            { a: "AASHTO (2018)", t: "A policy on geometric design of highways and streets (7th ed.)", f: "American Association of State Highway and Transportation Officials" },
            { a: "Alexander, G., & Lunenfeld, H. (1986)", t: "Driver expectancy in highway design and traffic operations", f: "Federal Highway Administration (Report No. FHWA-TO-86-1)" },
            { a: "ANSV (2022)", t: "Plan Nacional de Seguridad Vial Colombia 2022–2031", f: "Ministerio de Transporte de Colombia" },
            { a: "ANSV (2024a)", t: "Guía de urbanismo táctico para Colombia: Herramientas para la transformación de entornos viales seguros", f: "Agencia Nacional de Seguridad Vial", u: "https://www.ansv.gov.co/sites/default/files/2026/Publicaciones/Guia_de_Urbanismo_Tactico.pdf" },
            { a: "ANSV (2024b)", t: "Manual de señalización vial: Dispositivos uniformes para la regulación del tránsito en calles, carreteras y ciclorrutas de Colombia", f: "Gobierno de Colombia", u: "https://ansv.gov.co/es/publicaciones/manual-de-senalizacion-vial" },
            { a: "CAF (2022)", t: "Auditorías de Seguridad Vial", f: "Banco de Desarrollo de América Latina", u: "https://scioteca.caf.com/handle/123456789/1967" },
            { a: "Camacho, T. F., Pérez, Z. A., Campoy, U. J., & García, A. (2013)", t: "New geometric design consistency model based on operating speed profiles for road safety evaluation", f: "Accident Analysis & Prevention, 61, 33-42", u: "https://doi.org/10.1016/j.aap.2012.10.001" },
            { a: "Castro, M., Sánchez, J., Ardila, N., & Melo, J. (2010)", t: "Speed Models for Highway Consistency Analysis - A Colombian Case Study", f: "4th International Symposium on Highway Geometric Design, Transportation Research Board" },
            { a: "Charlton, S. G. et al. (2010)", t: "Using endemic road features to create self-explaining roads and reduce vehicle speeds", f: "Accident Analysis & Prevention, 42(6), 1989-1998", u: "https://doi.org/10.1016/j.aap.2010.06.006" },
            { a: "CROW (2017)", t: "Design manual for bicycle traffic", f: "CROW Knowledge Institute" },
            { a: "DNP (2018)", t: "Mejoramiento de vías terciarias: vías de tercer orden (1.ª ed.)", f: "Departamento Nacional de Planeación, Bogotá" },
            { a: "Dumbaugh, E., & Rae, M. (2009)", t: "Safe urban form: Revisiting the relationship between community design and traffic safety", f: "Journal of the American Planning Association, 75(3), 309-329", u: "https://doi.org/10.1080/01944360902950349" },
            { a: "Ewing, R., & Dumbaugh, E. (2009)", t: "The built environment and traffic safety: A review of empirical evidence", f: "Journal of Planning Literature, 23(4), 347-367", u: "https://doi.org/10.1177/0885412209335553" },
            { a: "FHWA (2025)", t: "Crash Modification Factors (CMFs)", f: "Federal Highway Administration", u: "https://cmfclearinghouse.fhwa.dot.gov/" },
            { a: "Fitzpatrick, K. et al. (2000)", t: "Speed Prediction for Two-Lane Rural Highways", f: "Federal Highway Administration (FHWA-RD-99-171)" },
            { a: "Hernández, L. (2024)", t: "Vulnerabilidad ante siniestros viales de la autopista Tuxtla Gutiérrez – San Cristóbal de las Casas, Chiapas, México", f: "Universidad de Ciencias y Artes de Chiapas" },
            { a: "IDU (2015)", t: "Guía para el diseño de vías urbanas para Bogotá D.C.", f: "Instituto de Desarrollo Urbano" },
            { a: "Imrie, R. (2012)", t: "Universalism, universal design and equitable access to the built environment", f: "Disability and Rehabilitation, 34(10), 873-882", u: "https://doi.org/10.3109/09638288.2011.624250" },
            { a: "INVIAS (2008)", t: "Manual de diseño geométrico de carreteras", f: "Instituto Nacional de Vías, Ministerio de Transporte" },
            { a: "iRAP (2022)", t: "Rehabilitación de superficies de carreteras", f: "Road Safety Toolkit - International Road Assessment Programme", u: "https://toolkit.irap.org/es/safer-road-treatments/road-surface-rehabilitation/" },
            { a: "Jurewicz, C., & Steinmetz, L. (2014)", t: "Development of a forgiving roadside design strategy", f: "Journal of the Australasian College of Road Safety, 25(2), 26-34" },
            { a: "Kockelke, W., & Steinbrecher, J. (1987)", t: "Fahrerverhaltensuntersuchungen zur Verkehrssicherheit im Bereich von Ortseinfahrten", f: "RWTH Aachen University", u: "https://katalog.ub.rwth-aachen.de/discovery/fulldisplay?vid=49HBZ_UBA:VU1&docid=alma991026296643406448&context=L" },
            { a: "Krammes, R. et al. (1995)", t: "Horizontal Alignment Design Consistency for Rural Two-Lane Highways", f: "Federal Highway Administration" },
            { a: "Lamm, R., Psarianos, B., & Mailaender, T. (1999)", t: "Highway Design and Traffic Safety Engineering Handbook", f: "McGraw-Hill Companies" },
            { a: "Ley 2251 (2022)", t: "Por la cual se dictan normas para el diseño de una política pública integral de seguridad vial con enfoque de sistema seguro", f: "Congreso de Colombia", u: "https://www.funcionpublica.gov.co/eva/gestornormativo/norma.php?i=189806" },
            { a: "Makishita, H., & Matsunaga, K. (2008)", t: "Differences of drivers' reaction times according to age and mental workload", f: "Accident Analysis & Prevention, 40(2), 567-575", u: "https://doi.org/10.1016/j.aap.2007.08.012" },
            { a: "Melo, J. (2006)", t: "Desarrollo de un método para evaluar la consistencia del diseño geométrico de carreteras en Colombia basado en el perfil de velocidades de operación, fase I", f: "Universidad del Cauca", u: "https://repositorio.unicauca.edu.co/handle/123456789/506" },
            { a: "Mintransporte (2016)", t: "Guía de ciclo: infraestructura para ciudades colombianas", f: "Ministerio de Transporte, Bogotá" },
            { a: "Mintransporte (2024)", t: "Metodología para el diseño, selección e instalación de sistemas de contención vehicular (Resolución 20243040022485 de 2024)", f: "Gobierno de Colombia" },
            { a: "Minvivienda (2024)", t: "Cartilla Calles Completas", f: "Ministerio de Vivienda, Ciudad y Territorio", u: "https://minvivienda.gov.co/viceministerio-de-vivienda-espacio-urbano-y-territorial-plan-ordenamiento-territorial-etapas-pot/cartilla-calles-completas" },
            { a: "NACTO (2016)", t: "Global Street Design Guide (1 ed.)", f: "National Association of City Transportation Officials" },
            { a: "OECD (2016)", t: "Zero road deaths and serious injuries: Leading a paradigm shift to a safe system", f: "OECD / International Transport Forum" },
            { a: "TRB Circular E-C151 (2011)", t: "Modeling operating speed: Synthesis report", f: "Transportation Research Board", u: "https://onlinepubs.trb.org/onlinepubs/circulars/ec151.pdf" },
            { a: "Oñate, C., & Calero, C. (2023)", t: "Parámetros que definen la velocidad de diseño de carreteras en terreno ondulado", f: "Respuestas, 18-32", u: "https://doi.org/10.22463/0122820X.2792" },
            { a: "Perco, P., & Robba, A. (2005)", t: "Evaluation of the deceleration rate for the operating speed-profile model", f: "3rd International SIIV Congress", u: "https://www.siiv.net/site/sites/default/files/Documenti/bari2005/060.pdf" },
            { a: "Pérez, A. M. (2012)", t: "Caracterización y modelización de la velocidad de operación en carreteras convencionales", f: "Universitat Politècnica de València", u: "https://dialnet.unirioja.es/servlet/tesis?codigo=73420" },
            { a: "PIARC (2015)", t: "Road safety manual: A manual for practitioners and decision makers on implementing safe system infrastructure", f: "PIARC World Road Association" },
            { a: "Posada, J., Cadavid, S., & Castro, L. (2014)", t: "Consistencia en el diseño. Predicción de la velocidad de operación en carreteras", f: "Ingeniería Solidaria, 10, 39-47", u: "https://doi.org/10.16925/in.v9i17.803" },
            { a: "Sánchez, O. J. (2011)", t: "Metodología para la evaluación de la consistencia del trazado de carreteras interurbanas de dos carriles", f: "Universidad Politécnica de Madrid" },
            { a: "Shinar, D. (2017)", t: "Traffic safety and human behavior (2 ed.)", f: "Emerald Publishing" },
            { a: "Steinfeld, E., & Maisel, J. (2012)", t: "Universal design: Creating inclusive environments", f: "John Wiley & Sons" },
            { a: "Theeuwes, J., & Godthelp, H. (1995)", t: "Self-explaining roads", f: "Safety Science, 19(2-3), 217-225", u: "https://doi.org/10.1016/0925-7535(94)00022-U" },
            { a: "TRB (2011)", t: "Transportation Research Board 2011 Annual Report", f: "Transportation Research Board", u: "https://www.trb.org/Main/Blurbs/166537.aspx" },
            { a: "Wegman, F. (2017)", t: "The future of road safety: A worldwide perspective", f: "IATSS Research, 40(2), 66-71", u: "https://doi.org/10.1016/j.iatssr.2016.05.003" }
        ];

        const grid = document.getElementById('grid');

        sources.forEach((s, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            
            card.style.animationDelay = `${0.25 + (index * 0.03)}s`;
            
            let footerContent = s.f;
            if (s.u) {
                footerContent += ` — <a href="${s.u}" target="_blank" class="link-text">${s.u}</a>`;
            }

            let html = `
                <div class="author-tag">${s.a}</div>
                <div class="title">${s.t}</div>
                <div class="footer-info">${footerContent}</div>
            `;

            card.innerHTML = html;
            grid.appendChild(card);
        });
    </script>
</body>
</html>
